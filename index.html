<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Pendulum Demo</title>
		<link rel="stylesheet" href="main.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono">
	</head>
	<body>
		<header>
			<h1>Double Pendulum Demo</h1>
		</header>
		<div class="stage">
			<div class="canvaswrap">
					<canvas width="900" height="600" id="canvas"></canvas>
			</div>
			<div class="controls">
				<div class="control">
					<label>Mass 1: <span id="m1Val">10<span></label>
					<input id="m1" type="range" min="1" max="50" value="10"/>
				</div>
				<div class="control">
					<label>Mass 2: <span id="m2Val">10<span></label>
					<input id="m2" type="range" min="1" max="50" value="10"/>
				</div>
				<div class="control">
					<label>Length 1: <span id="l1Val">40<span></label>
					<input id="l1" type="range" min="40" max="250" value="160"/>
				</div>
				<div class="control">
					<label>Length 2: <span id="l2Val">40<span></label>
					<input id="l2" type="range" min="40" max="250" value="160"/>
				</div>
				<div class="control">
					<label>Damping: <span id="dampVal">1<span></label>
					<input id="damping" type="range" min="0.95" max="1" step="0.00001"  value="1"/>
				</div>
				<div class="control">
					<label>Gravity: <span id="gravVal">9.81<span></label>
					<input id="grav" type="range" min="0" max="20" step="0.01" value="9.81"/>
				</div>
				<div class="control">
					<label>Angle (Degrees): <span id="angleVal">90.0</span> </label>
					<input id="angle" type="number" value="90.0" placeholder="Angle in Degrees"/>
				</div>				
		</div>		
	<script src="pendulum.js"></script>
	</body>
</html>
